<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64"
     role="img" aria-label="Sentinel Intelligence — Centro de Inteligencia Digital">

  <!-- VARIANTE HORIZONTAL — cabeceras y barras de navegación. -->

  <defs>
    <linearGradient id="hCabeza" x1="32" y1="10" x2="32" y2="54"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B5FFF"/>
      <stop offset="1" stop-color="#081A4A"/>
    </linearGradient>
    <linearGradient id="hHalo" x1="4" y1="4" x2="60" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#0B5FFF"/>
    </linearGradient>
  </defs>

  <g stroke="url(#hHalo)" stroke-width="1.6" fill="none" stroke-linecap="round"
