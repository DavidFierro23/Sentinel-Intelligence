  </g>

  <text x="100" y="105" text-anchor="middle"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">
    Sentinel Intelligence
  </text>

  <text x="100" y="122" text-anchor="middle"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="500" fill="#00D4FF" letter-spacing="1.8">
    CENTRO DE INTELIGENCIA DIGITAL
  </text>
</svg>
