<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150"
     role="img" aria-label="Sentinel Intelligence — Centro de Inteligencia Digital">

  <!-- VARIANTE VERTICAL — portadas, informes y pantallas de carga. -->

  <defs>
    <linearGradient id="vCabeza" x1="100" y1="18" x2="100" y2="98"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B5FFF"/>
      <stop offset="1" stop-color="#081A4A"/>
    </linearGradient>
    <linearGradient id="vHalo" x1="46" y1="12" x2="154" y2="104"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#0B5FFF"/>
    </linearGradient>
  </defs>

  <g transform="translate(68 12) scale(1)">
    <g stroke="url(#vHalo)" stroke-width="1.6" fill="none" stroke-linecap="round"
       opacity="0.85">
      <path d="M 32 2.4 A 29.6 29.6 0 0 1 61.6 32"/>
      <path d="M 61.6 32 A 29.6 29.6 0 0 1 32 61.6"/>
      <path d="M 32 61.6 A 29.6 29.6 0 0 1 2.4 32"/>
      <path d="M 2.4 32 A 29.6 29.6 0 0 1 32 2.4"/>
    </g>

    <g fill="#061126">
      <rect x="30.4" y="0" width="3.2" height="5"/>
      <rect x="30.4" y="59" width="3.2" height="5"/>
      <rect x="0" y="30.4" width="5" height="3.2"/>
      <rect x="59" y="30.4" width="5" height="3.2"/>
    </g>

    <circle cx="32" cy="32" r="20.5" fill="url(#vCabeza)"/>
    <circle cx="32" cy="32" r="20.5" fill="none" stroke="#00D4FF" stroke-width="1.3"
            opacity="0.55"/>

    <path d="M 17.8 17.8 L 22.6 13.4 L 23.8 20.4 Z" fill="#0B5FFF"/>
    <path d="M 46.2 17.8 L 41.4 13.4 L 40.2 20.4 Z" fill="#0B5FFF"/>

    <g stroke="#00D4FF" stroke-width="2.6" stroke-linecap="round">
      <line x1="16.6" y1="23.4" x2="27.4" y2="22.0"/>
      <line x1="47.4" y1="23.4" x2="36.6" y2="22.0"/>
    </g>

    <circle cx="23.6" cy="31.2" r="7.1" fill="#061126"/>
    <circle cx="23.6" cy="31.2" r="7.1" fill="none" stroke="#00D4FF" stroke-width="1.1"/>
    <circle cx="23.6" cy="31.2" r="3.5" fill="#00D4FF"/>

    <circle cx="40.4" cy="31.2" r="7.1" fill="#061126"/>
    <circle cx="40.4" cy="31.2" r="7.1" fill="none" stroke="#0B5FFF" stroke-width="1.1"/>
    <circle cx="40.4" cy="31.2" r="3.5" fill="#4C8DFF"/>

    <path d="M 32 34.6 L 29.1 39.4 L 34.9 39.4 Z" fill="#00D4FF"/>
    <path d="M 24.4 43.6 Q 32 48.4 39.6 43.6" fill="none" stroke="#00D4FF"
