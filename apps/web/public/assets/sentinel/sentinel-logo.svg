<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Sentinel Intelligence">

  <!--
  ===========================================================
  SENTINEL INTELLIGENCE — ISOTIPO OFICIAL
  ===========================================================

  Búho minimalista. Geometría congelada: no redibujar ni
  alterar proporciones.

  Lectura simbólica, fijada por la identidad oficial:

    ojo izquierdo (cian)  EXTRACCIÓN
    ojo derecho  (azul)   ANÁLISIS
    los dos juntos        CORRELACIÓN

  Por eso los ojos comparten tamaño y altura exactos y difieren
  solo en color: la correlación exige dos miradas equivalentes.
  El arco que los une bajo el pico es esa correlación hecha
  trazo.

  Cejas COMPACTAS y horizontales, con una inclinación de 8
  grados. Deliberadamente no agresivas: una ceja muy inclinada
  convierte al búho en depredador, y la marca vigila, no ataca.

  El halo es tecnológico —anillo segmentado, no aureola—: cuatro
  cortes que sugieren un radar en barrido.

  Paleta oficial únicamente:
    #081A4A primary · #0B5FFF blue · #00D4FF cyan · #061126 bg
  ===========================================================
  -->

  <defs>
    <linearGradient id="sentinelCabeza" x1="32" y1="10" x2="32" y2="54"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B5FFF"/>
      <stop offset="1" stop-color="#081A4A"/>
    </linearGradient>

    <linearGradient id="sentinelHalo" x1="4" y1="4" x2="60" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#0B5FFF"/>
    </linearGradient>
  </defs>

  <!-- HALO TECNOLÓGICO — anillo segmentado, barrido de radar -->
  <g stroke="url(#sentinelHalo)" stroke-width="1.6" fill="none"
     stroke-linecap="round" opacity="0.85">
    <path d="M 32 2.4 A 29.6 29.6 0 0 1 61.6 32"/>
    <path d="M 61.6 32 A 29.6 29.6 0 0 1 32 61.6"/>
    <path d="M 32 61.6 A 29.6 29.6 0 0 1 2.4 32"/>
    <path d="M 2.4 32 A 29.6 29.6 0 0 1 32 2.4"/>
  </g>

  <!-- Cortes del halo: separan los cuatro cuadrantes -->
  <g fill="#061126">
    <rect x="30.4" y="0" width="3.2" height="5" />
    <rect x="30.4" y="59" width="3.2" height="5" />
    <rect x="0" y="30.4" width="5" height="3.2" />
    <rect x="59" y="30.4" width="5" height="3.2" />
  </g>

  <!-- CABEZA -->
  <circle cx="32" cy="32" r="20.5" fill="url(#sentinelCabeza)"/>
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="#00D4FF"
          stroke-width="1.3" opacity="0.55"/>

  <!-- PENACHOS — apenas insinuados, integrados en la silueta -->
  <path d="M 17.8 17.8 L 22.6 13.4 L 23.8 20.4 Z" fill="#0B5FFF"/>
  <path d="M 46.2 17.8 L 41.4 13.4 L 40.2 20.4 Z" fill="#0B5FFF"/>

  <!-- CEJAS COMPACTAS — inclinación de 8 grados, extremos redondeados -->
  <g stroke="#00D4FF" stroke-width="2.6" stroke-linecap="round">
    <line x1="16.6" y1="23.4" x2="27.4" y2="22.0"/>
    <line x1="47.4" y1="23.4" x2="36.6" y2="22.0"/>
  </g>

  <!-- OJO IZQUIERDO · EXTRACCIÓN -->
  <circle cx="23.6" cy="31.2" r="7.1" fill="#061126"/>
  <circle cx="23.6" cy="31.2" r="7.1" fill="none" stroke="#00D4FF"
          stroke-width="1.1"/>
  <circle cx="23.6" cy="31.2" r="3.5" fill="#00D4FF"/>
  <circle cx="22.3" cy="29.9" r="1.15" fill="#FFFFFF" opacity="0.9"/>

  <!-- OJO DERECHO · ANÁLISIS -->
  <circle cx="40.4" cy="31.2" r="7.1" fill="#061126"/>
  <circle cx="40.4" cy="31.2" r="7.1" fill="none" stroke="#0B5FFF"
          stroke-width="1.1"/>
  <circle cx="40.4" cy="31.2" r="3.5" fill="#4C8DFF"/>
  <circle cx="39.1" cy="29.9" r="1.15" fill="#FFFFFF" opacity="0.9"/>

  <!-- PICO -->
  <path d="M 32 34.6 L 29.1 39.4 L 34.9 39.4 Z" fill="#00D4FF"/>

  <!-- ARCO DE CORRELACIÓN — une las dos miradas -->
  <path d="M 24.4 43.6 Q 32 48.4 39.6 43.6" fill="none" stroke="#00D4FF"
        stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
</svg>
